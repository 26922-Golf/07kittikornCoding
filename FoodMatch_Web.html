ating": 4.8, "tags": ["Chocolate", "Dessert"], "description": "เค้กช็อกโกแลตเนื้อนุ่มเข้มข้น", "ingredients": ["แป้ง", "โกโก้", "ไข่", "น้ำตาล", "นม"], "steps": ["ผสมส่วนผสม", "เทลงพิมพ์", "อบ", "พักให้เย็น", "ตกแต่ง"]}, {"name": "Strawberry Cheesecake", "category": "Dessert", "emoji": "🍓", "rating": 4.9, "tags": ["Cheese", "Strawberry", "Dessert"], "description": "ชีสเค้กพร้อมสตรอว์เบอร์รี", "ingredients": ["ครีมชีส", "บิสกิต", "สตรอว์เบอร์รี", "น้ำตาล"], "steps": ["ทำฐานบิสกิต", "ตีครีมชีส", "เทใส่ฐาน", "แช่เย็น", "ตกแต่ง"]}, {"name": "Pancakes", "category": "Dessert", "emoji": "🥞", "rating": 4.6, "tags": ["Dessert", "Breakfast"], "description": "แพนเค้กนุ่ม ๆ เสิร์ฟพร้อมน้ำผึ้ง", "ingredients": ["แป้ง", "ไข่", "นม", "น้ำตาล", "น้ำผึ้ง"], "steps": ["ผสมแป้ง", "เติมไข่และนม", "คนให้เข้ากัน", "ทอดบนกระทะ", "ราดน้ำผึ้ง"]}, {"name": "Ice Cream", "category": "Dessert", "emoji": "🍨", "rating": 4.5, "tags": ["Dessert", "Milk"], "description": "ไอศกรีมเย็นหวาน", "ingredients": ["นม", "ครีม", "น้ำตาล"], "steps": ["ผสมส่วนผสม", "แช่เย็น", "ปั่น", "แช่แข็ง"]}];let prefs={liked:[],disliked:[],cannot_eat:[]};let current=null;const cats=[['🍚','Thai'],['🍝','Pasta'],['🍕','Pizza'],['🍔','Burger'],['🍗','Chicken'],['🥩','Beef'],['🐷','Pork'],['🍤','Shrimp'],['🐟','Fish'],['🍣','Japanese'],['🇰🇷','Korean'],['🥗','Healthy'],['🌶️','Spicy'],['🍰','Dessert']];const $=x=>document.getElementById(x);function score(f){if(prefs.cannot_eat.some(x=>x===f.category||f.tags.includes(x)))return 0;let s=f.rating;prefs.liked.forEach(x=>{if(x===f.category||f.tags.includes(x))s+=.5});prefs.disliked.forEach(x=>{if(x===f.category||f.tags.includes(x))s-=1});return Math.max(0,Math.min(5,Math.round(s*10)/10))}function stars(s){return '★'.repeat(Math.floor(s))+'☆'.repeat(5-Math.floor(s))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(f){let s=score(f);let r=s>=4.5?'🔥 เหมาะกับคุณมาก':s>=3.5?'👍 น่าสนใจ':'อาจลองได้';return `<div class="card"><div class="emoji">${f.emoji}</div><div class="info"><div class="name">${esc(f.name)}</div><div class="stars">${stars(s)} ${s}/5</div><div class="rec">${r}</div></div><button class="smallbtn" onclick='detail(${JSON.stringify(f)})'>ดู</button></div>`}function cards(list){let a=list.filter(f=>score(f)>0).sort((a,b)=>score(b)-score(a));return a.length?a.map(card).join(''):'<div class="center muted topspace">ไม่พบอาหารที่เหมาะกับคุณ</div>'}function prefPage(){let section=(title,sub,type)=>`<section class="panel"><h3>${title}</h3><div class="muted">${sub}</div><div class="chips">${cats.map(([e,c])=>`<button class="chip ${prefs[type].includes(c)?type==='liked'?'liked':type==='disliked'?'disliked':'cannot':''}" onclick="togglePref('${type}','${c}')">${e} ${c}</button>`).join('')}</div></section>`;app.innerHTML=`<div class="brand">🍽️ FoodMatch</div><div class="subtitle">มาทำความรู้จักคุณกันก่อน</div><p class="center muted">เลือกอาหารที่ชอบ ไม่ชอบ และกินไม่ได้</p>${section('❤️ เมนูที่ชอบ','อาหารที่คุณชอบ','liked')}${section('👎 เมนูที่ไม่ชอบ','อาหารที่คุณไม่ค่อยชอบ','disliked')}${section('🚫 เมนูที่กินไม่ได้','อาหารที่แพ้หรือรับประทานไม่ได้','cannot_eat')}<button class="primary" onclick="homePage()">เริ่มค้นหาอาหารที่เหมาะกับฉัน →</button>`}function togglePref(t,c){if(prefs[t].includes(c))prefs[t]=prefs[t].filter(x=>x!==c);else{if(t==='cannot_eat'){prefs.liked=prefs.liked.filter(x=>x!==c);prefs.disliked=prefs.disliked.filter(x=>x!==c)}else prefs.cannot_eat=prefs.cannot_eat.filter(x=>x!==c);prefs[t].push(c)}prefPage()}function homePage(){app.innerHTML=`<div class="muted">Hello 👋</div><div class="page-title">อาหารที่เหมาะกับคุณ</div><div class="muted">ระบบจัดอันดับจากความชอบของคุณ</div><input id="search" class="search" placeholder="ค้นหาอาหาร..." oninput="searchFood()"><button class="secondary" onclick="moreOptions()">🔎 ค้นหา / หาตัวเลือกอาหารเพิ่มเติม</button><div class="page-title" style="font-size:18px">⭐ แนะนำสำหรับคุณ</div><div id="foodArea">${cards(FOODS)}</div><button class="secondary" onclick="prefPage()">⚙ แก้ไขความชอบ</button>`}function searchFood(){let q=$('search').value.trim().toLowerCase();let r=FOODS.filter(f=>(f.name+' '+f.category+' '+f.tags.join(' ')).toLowerCase().includes(q));$('foodArea').innerHTML=cards(r)}function detail(f){current=f;app.innerHTML=`<button class="back" onclick="homePage()">← กลับ</button><div class="center"><div class="bigemoji">${f.emoji}</div><div class="page-title">${esc(f.name)}</div><div class="stars">${stars(score(f))} ${score(f)}/5</div><p class="muted">${esc(f.description)}</p></div><button class="primary" onclick="likeFood()">❤️ ฉันสนใจเมนูนี้</button><button class="secondary" onclick="recipePage()">👨‍🍳 ดูวิธีทำ</button><button class="secondary" onclick="restaurantPage()">🍽️ หาร้านอาหาร</button><button class="secondary" onclick="otherRecipes()">⭐ ดูสูตรอื่น / หาตัวเลือกเพิ่ม</button>`}function likeFood(){if(!prefs.liked.includes(current.category))prefs.liked.push(current.category);alert('❤️ บันทึกความสนใจแล้ว!')}function recipePage(){let f=current;app.innerHTML=`<button class="back" onclick='detail(${JSON.stringify(f)})'>← กลับ</button><div class="center"><div class="page-title">👨‍🍳 วิธีทำ</div><b>${esc(f.name)}</b></div><h3>วัตถุดิบ</h3>${f.ingredients.map(x=>`<div class="ingredient">• ${esc(x)}</div>`).join('')}<h3>วิธีทำ</h3>${f.steps.map((x,i)=>`<div class="step">${i+1}. ${esc(x)}</div>`).join('')}`}function restaurantPage(){let f=current;app.innerHTML=`<button class="back" onclick='detail(${JSON.stringify(f)})'>← กลับ</button><div class="center"><div class="page-title">🍽️ ร้านอาหาร</div><div class="muted">ร้านที่มี ${esc(f.name)}</div></div>${[['FoodMatch Kitchen','★ 4.8','20-30 นาที'],['Urban Food','★ 4.6','25-35 นาที'],['Daily Restaurant','★ 4.7','30-40 นาที']].map(x=>`<div class="option"><h3>${x[0]}</h3><p>${x[1]} • ${x[2]}</p></div>`).join('')}`}function moreOptions(){app.innerHTML=`<button class="back" onclick="homePage()">← กลับ</button><div class="center"><div class="page-title">🔎 หาตัวเลือกเพิ่ม</div><div class="muted">เลือกวิธีที่คุณต้องการค้นหาอาหาร</div></div><div class="option"><h3>⭐ อาหารที่เหมาะกับฉัน</h3><p>ดูอาหารที่ระบบจัดอันดับจากความชอบ</p><button class="smallbtn" onclick="recommended()">เลือก</button></div><div class="option"><h3>📂 เลือกตามหมวดหมู่</h3><p>เลือก Thai, Japanese, Korean, Pasta และอื่น ๆ</p><button class="smallbtn" onclick="categoryPage()">เลือก</button></div><div class="option"><h3>🔎 ค้นหาอาหารด้วยตัวเอง</h3><p>ค้นหาจากชื่ออาหารหรือประเภท</p><button class="smallbtn" onclick="homePage()">เลือก</button></div>`}function otherRecipes(){let f=current;app.innerHTML=`<button class="back" onclick='detail(${JSON.stringify(f)})'>← กลับ</button><div class="center"><div class="page-title">⭐ ตัวเลือกเพิ่มเติม</div><div class="muted">ตัวเลือกสำหรับ ${esc(f.name)}</div></div><button class="primary" onclick="recipeOptions()">👨‍🍳 สูตรอื่นของเมนูนี้</button><button class="secondary" onclick="similarFoods()">🍽️ หาเมนูใกล้เคียง</button><button class="secondary" onclick="homePage()">🔎 ค้นหาอาหารด้วยตัวเอง</button><button class="secondary" onclick="recommended()">⭐ อาหารที่เหมาะกับฉัน</button><button class="secondary" onclick="categoryPage()">📂 เลือกอาหารตามหมวดหมู่</button>`}function recipeOptions(){let f=current;let rs=[['🍳 สูตรดั้งเดิม','รสชาติดั้งเดิม เหมาะสำหรับคนที่ต้องการรสชาติคลาสสิก'],['🌶️ สูตรเผ็ด','เพิ่มความเผ็ดและเครื่องเทศ'],['🧀 สูตรชีส','เพิ่มชีสให้รสชาติเข้มข้น'],['🥗 สูตรสุขภาพ','ลดความมันและเพิ่มผัก'],['💪 สูตรโปรตีนสูง','เพิ่มเนื้อสัตว์หรือแหล่งโปรตีน']];app.innerHTML=`<button class="back" onclick="otherRecipes()">← กลับ</button><div class="center"><div class="page-title">👨‍🍳 สูตรอื่น</div><div class="muted">สูตรอื่นของ ${esc(f.name)}</div></div>${rs.map(x=>`<div class="option"><h3>${x[0]}</h3><p>${x[1]}</p><button class="smallbtn" onclick='alert("คุณเลือก\\n\\n${x[0]}\\n\\nสามารถนำสูตรนี้ไปดูรายละเอียดและปรับแต่งต่อได้")'>เลือกสูตร</button></div>`).join('')}`}function similarFoods(){let f=current;let a=FOODS.filter(x=>x.name!==f.name&&x.tags.some(t=>f.tags.includes(t))).sort((a,b)=>score(b)-score(a)).slice(0,10);app.innerHTML=`<button class="back" onclick="otherRecipes()">← กลับ</button><div class="page-title">🍽️ เมนูใกล้เคียง</div><div class="muted">อาหารที่มีลักษณะคล้ายกับเมนูที่คุณสนใจ</div>${cards(a)}`}function recommended(){app.innerHTML=`<button class="back" onclick="homePage()">← กลับ</button><div class="page-title">⭐ อาหารที่เหมาะกับคุณ</div><div class="muted">จัดอันดับจากความชอบที่คุณเลือกไว้</div>${cards(FOODS.slice().sort((a,b)=>score(b)-score(a)).slice(0,10))}`}function categoryPage(){let cs=[...new Set(FOODS.map(f=>f.category))].sort();app.innerHTML=`<button class="back" onclick="homePage()">← กลับ</button><div class="center"><div class="page-title">📂 เลือกหมวดหมู่</div><div class="muted">เลือกประเภทอาหารที่คุณสนใจ</div></div>${cs.map(c=>`<button class="secondary" style="text-align:left" onclick='showCategory(${JSON.stringify(c)})'>🍴 ${esc(c)} (${FOODS.filter(f=>f.category===c).length} เมนู)</button>`).join('')}`}function showCategory(c){app.innerHTML=`<button class="back" onclick="categoryPage()">← กลับ</button><div class="page-title">🍴 ${esc(c)}</div>${cards(FOODS.filter(f=>f.category===c))}`}prefPage();</script></body></html>
